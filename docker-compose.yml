services:
  mysql:
    image: mysql:8.4
    container_name: sales_sql_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sales_analytics
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./sql/03_views.sql:/docker-entrypoint-initdb.d/03_views.sql
      - ./sql/04_advanced_features.sql:/docker-entrypoint-initdb.d/04_advanced_features.sql
volumes:
  mysql_data:
